<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Settlement {{.PeriodFrom}} – {{.PeriodTo}}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; color: #1a1a1a; font-size: 14px; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .meta { color: #555; margin-bottom: 24px; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e5e5e5; text-align: left; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #666; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    tfoot td { font-weight: 600; border-top: 2px solid #222; }
  </style>
</head>
<body>
  <h1>Settlement report</h1>
  <p class="meta">{{.OrgName}} · {{.PeriodFrom}} – {{.PeriodTo}} · {{.InvoiceCount}} documents</p>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Number</th>
        <th>Buyer</th>
        <th>Type</th>
        <th>Status</th>
        <th class="num">Amount</th>
      </tr>
    </thead>
    <tbody>
      {{range .Lines}}
      <tr>
        <td>{{.IssuedAt}}</td>
        <td>{{.Number}}</td>
        <td>{{.BuyerName}}</td>
        <td>{{.Kind}}</td>
        <td>{{.Status}}</td>
        <td class="num">{{.Amount}}</td>
      </tr>
      {{end}}
    </tbody>
    <tfoot>
      <tr>
        <td colspan="5">Total</td>
        <td class="num">{{.Total}}</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
